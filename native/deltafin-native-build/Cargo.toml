[package]
name = "deltafin-native-build"
version = "0.1.0"
description = "Shared Python-free native build graph for Deltafin"
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
deltafin-bootstrap = { path = "../deltafin-bootstrap" }
deltafin-sys = { path = "../deltafin-sys" }
# Visual Studio discovery for the Windows build: dependency-free, and already
# in the graph as the locator the standard cc crate uses.
find-msvc-tools = "=0.1.9"
serde_json = "=1.0.145"
sha2 = "=0.10.9"

[dev-dependencies]
deltafin-sys = { path = "../deltafin-sys", features = ["testing"] }
